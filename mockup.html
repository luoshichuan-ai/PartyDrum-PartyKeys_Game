<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Chord Display Mockup</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d18; color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
}

h2 {
  position: absolute; top: 10px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px; color: #555; letter-spacing: 2px;
  pointer-events: none;
}

canvas { display: block; }
</style>
</head>
<body>
<h2>CHORD LANE — NEW DESIGN MOCKUP</h2>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const W = canvas.width, H = canvas.height;
const NOTE_R = 22;
const KB_H = 60;
const HIT_Y = H - KB_H - 60;

// ── helpers ──
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function hexRgb(hex){
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function rStr(r,g,b,a=1){ return `rgba(${r},${g},${b},${a})`; }

// ── chord examples falling at different positions ──
// Each chord: { name, notes:['C4','E4','G4'], color, y }
const NOTE_LABELS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// We'll show 3 example chords at different y positions
const chords = [
  // chord near top (approaching)
  { name: 'C maj', color: '#9b5de5', y: HIT_Y * 0.18,
    noteNames: ['C4','E4','G4'] },
  // chord mid-screen
  { name: 'G min', color: '#00bbf9', y: HIT_Y * 0.52,
    noteNames: ['G3','A#3','D4'] },
  // chord near hit line (almost time to press)
  { name: 'F maj7', color: '#f15bb5', y: HIT_Y * 0.85,
    noteNames: ['F3','A3','C4','E4'] },
];

// 3 note lanes spread across the right half
// Right half: x from W/2 to W
const HALF_L = W / 2;
const HALF_W = W / 2;

// Lane positions: evenly spaced, max 4 notes
function noteLaneX(noteIdx, total) {
  const spacing = Math.min(90, HALF_W / (total + 1));
  const totalW = spacing * (total - 1);
  const startX = HALF_L + HALF_W/2 - totalW/2;
  return startX + noteIdx * spacing;
}

function drawBackground() {
  ctx.fillStyle = '#0d0d18';
  ctx.fillRect(0, 0, W, H);

  // left half (drums - greyed out for context)
  ctx.fillStyle = 'rgba(255,255,255,0.01)';
  ctx.fillRect(0, 0, HALF_L, H);

  // right half background
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(HALF_L, 0, HALF_W, H);

  // center divider
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(HALF_L, 0); ctx.lineTo(HALF_L, H); ctx.stroke();

  // hit line
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(HALF_L, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
  ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
  ctx.fillText('▶  PRESS HERE', HALF_L + 10, HIT_Y - 8);

  // left side label
  ctx.fillStyle = '#222'; ctx.font = 'bold 120px Arial'; ctx.textAlign = 'center';
  ctx.fillText('🥁', HALF_L/2, H/2 + 40);
  ctx.fillStyle = '#333'; ctx.font = '13px Arial';
  ctx.fillText('DRUMS (unchanged)', HALF_L/2, H/2 + 90);
}

function drawKeyboard() {
  const kbY = H - KB_H;
  const kw = HALF_W / 36;

  const KEY_IS_BLACK = [0,1,0,1,0,0,1,0,1,0,1,0];

  for (let i = 0; i < 36; i++) {
    const x = HALF_L + i * kw;
    const isBlk = KEY_IS_BLACK[i % 12] === 1;
    ctx.fillStyle = isBlk ? '#1e1e1e' : '#3a3a3a';
    ctx.fillRect(x+1, kbY+2, kw-2, KB_H-4);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5;
    ctx.strokeRect(x+1, kbY+2, kw-2, KB_H-4);
  }

  // keyboard label
  ctx.fillStyle = '#444'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('36-key keyboard', HALF_L + HALF_W/2, kbY - 8);
}

function drawNote(x, y, color, label, isHighlighted) {
  const rgb = hexRgb(color);

  // glow
  if (isHighlighted) {
    ctx.beginPath(); ctx.arc(x, y, NOTE_R + 14, 0, Math.PI*2);
    ctx.fillStyle = rStr(...rgb, 0.2); ctx.fill();
  }

  // halo
  ctx.beginPath(); ctx.arc(x, y, NOTE_R + 6, 0, Math.PI*2);
  ctx.fillStyle = rStr(...rgb, 0.1); ctx.fill();

  // circle body
  const g = ctx.createRadialGradient(x - NOTE_R*0.3, y - NOTE_R*0.3, 0, x, y, NOTE_R);
  g.addColorStop(0, '#fff');
  g.addColorStop(0.3, color);
  g.addColorStop(1, rStr(...rgb, 0.5));
  ctx.beginPath(); ctx.arc(x, y, NOTE_R, 0, Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();

  // note label inside circle
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
  ctx.textBaseline = 'alphabetic';
}

function drawChordConnector(notes, y, color) {
  if (notes.length < 2) return;
  const rgb = hexRgb(color);
  const xs = notes.map((_, i) => noteLaneX(i, notes.length));

  ctx.strokeStyle = rStr(...rgb, 0.35);
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.moveTo(xs[0], y);
  for (let i = 1; i < xs.length; i++) ctx.lineTo(xs[i], y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawChordLabel(chord) {
  const total = chord.noteNames.length;
  const xs = chord.noteNames.map((_, i) => noteLaneX(i, total));
  const centerX = (xs[0] + xs[xs.length-1]) / 2;
  const rgb = hexRgb(chord.color);
  const y = chord.y;

  // pill background for chord name
  const text = chord.name;
  ctx.font = 'bold 15px Arial';
  const tw = ctx.measureText(text).width;
  const pw = tw + 20, ph = 26;
  const px = centerX - pw/2, py = y - NOTE_R - ph - 6;

  ctx.fillStyle = rStr(...rgb, 0.18);
  rrect(px, py, pw, ph, 6); ctx.fill();
  ctx.strokeStyle = rStr(...rgb, 0.7); ctx.lineWidth = 1;
  rrect(px, py, pw, ph, 6); ctx.stroke();

  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText(text, centerX, py + ph*0.72);
}

function drawVerticalLaneGuides() {
  // show faint vertical guides for each note lane (for 3-note chord)
  const sampleTotal = 3;
  for (let i = 0; i < sampleTotal; i++) {
    const x = noteLaneX(i, sampleTotal);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, HIT_Y); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawChord(chord) {
  const total = chord.noteNames.length;
  const isNear = chord.y > HIT_Y * 0.75;

  // connector line between notes
  drawChordConnector(chord.noteNames, chord.y, chord.color);

  // chord name label above
  drawChordLabel(chord);

  // individual note circles
  chord.noteNames.forEach((noteName, i) => {
    const x = noteLaneX(i, total);
    drawNote(x, chord.y, chord.color, noteName, isNear);
  });
}

// ── annotation arrows & labels ──
function drawAnnotations() {
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left';

  // arrow to chord name pill
  const chord0 = chords[0];
  const total0 = chord0.noteNames.length;
  const xs0 = chord0.noteNames.map((_,i) => noteLaneX(i, total0));
  const cx0 = (xs0[0]+xs0[xs0.length-1])/2;
  const pillY0 = chord0.y - NOTE_R - 32 - 6;
  ctx.beginPath();
  ctx.moveTo(cx0 + 60, pillY0 - 10);
  ctx.lineTo(cx0 + 10, pillY0 + 10);
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillText('← 完整和弦名', cx0 + 62, pillY0 - 8);

  // arrow to note circle
  const x1 = noteLaneX(1, total0);
  ctx.beginPath();
  ctx.moveTo(x1 + 40, chord0.y + 30);
  ctx.lineTo(x1 + 4, chord0.y + 4);
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillText('← 每个音单独下落', x1 + 42, chord0.y + 32);

  // arrow to connector
  ctx.fillText('虚线 = 同一和弦', HALF_L + HALF_W*0.05, chords[1].y - 4);

  // "filtered out" example
  const filtY = HIT_Y * 0.37;
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 12px Arial';
  ctx.fillText('✕  间隔太近的和弦 → 删除', HALF_L + HALF_W*0.04, filtY);
  ctx.strokeStyle = '#ff444488'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
  ctx.strokeRect(HALF_L + HALF_W*0.04 - 4, filtY - 16, 220, 22);
  ctx.setLineDash([]);
}

// ── main draw ──
function render() {
  drawBackground();
  drawKeyboard();
  drawVerticalLaneGuides();
  chords.forEach(drawChord);
  drawAnnotations();
}

render();
</script>
</body>
</html>
