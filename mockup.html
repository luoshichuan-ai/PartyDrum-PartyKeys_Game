<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Lyrics Bar Mockup</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F5F4EF;
  font-family: 'Segoe UI', Arial, sans-serif;
  height: 100vh; overflow: hidden;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const W = canvas.width, H = canvas.height;

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

// ── Background: game screen skeleton ──
ctx.fillStyle = '#F5F4EF';
ctx.fillRect(0, 0, W, H);

// HUD
ctx.fillStyle = '#fff';
ctx.fillRect(0, 0, W, 60);
ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(0,60); ctx.lineTo(W,60); ctx.stroke();
ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,60); ctx.stroke();
ctx.fillStyle = '#aaa'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
ctx.fillText('DRUMS', 20, 38);
ctx.fillText('KEYS', W/2+20, 38);
ctx.fillStyle = '#1a1a2e'; ctx.font = 'bold 28px Arial';
ctx.fillText('0', 90, 42);
ctx.fillText('0', W/2+80, 42);

// Game area hint
ctx.fillStyle = 'rgba(0,0,0,0.04)';
ctx.fillRect(0, 60, W/2, H-60);
ctx.fillStyle = 'rgba(0,0,0,0.02)';
ctx.fillRect(W/2, 60, W/2, H-60);
ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(W/2, 60); ctx.lineTo(W/2, H); ctx.stroke();

// ── OPTION A: Full-width lyric bar (top, below HUD) ──
const LYRIC_H = 56;
const LYRIC_Y = 60; // flush below HUD

// Bar background
ctx.fillStyle = '#fff';
ctx.fillRect(0, LYRIC_Y, W, LYRIC_H);
// Bottom border
ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(0, LYRIC_Y + LYRIC_H); ctx.lineTo(W, LYRIC_Y + LYRIC_H); ctx.stroke();
// Top border (same as HUD bottom)
ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(0, LYRIC_Y); ctx.lineTo(W, LYRIC_Y); ctx.stroke();

// Current lyric text
const currentLyric = '就让这 大风吹 大风吹 一直吹';
ctx.font = 'bold 34px "Segoe UI", Arial';
ctx.textAlign = 'center';
ctx.fillStyle = '#1a1a2e';
ctx.fillText(currentLyric, W/2, LYRIC_Y + LYRIC_H * 0.67);

// Subtle "VOCAL" label on left
ctx.fillStyle = '#ccc'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left';
ctx.fillText('♪ VOCAL', 16, LYRIC_Y + LYRIC_H * 0.67);

// ── Annotation: show next lyric faded ──
// (optional: next line preview)
const nextLyric = '吹走我心里 那段痛 那段悲';
ctx.font = '18px "Segoe UI", Arial';
ctx.textAlign = 'center';
ctx.fillStyle = 'rgba(26,26,46,0.25)';
ctx.fillText(nextLyric, W/2, LYRIC_Y + LYRIC_H + 28);

// ── Labels / annotations ──
ctx.fillStyle = '#E60012';
ctx.font = 'bold 13px Arial';
ctx.textAlign = 'left';

// Arrow to lyric bar
ctx.beginPath();
ctx.moveTo(W*0.78, LYRIC_Y + LYRIC_H/2);
ctx.lineTo(W*0.72 + 8, LYRIC_Y + LYRIC_H/2);
ctx.strokeStyle = '#E60012'; ctx.lineWidth = 1.5; ctx.stroke();
// arrowhead
ctx.beginPath();
ctx.moveTo(W*0.72+8, LYRIC_Y+LYRIC_H/2-4);
ctx.lineTo(W*0.72, LYRIC_Y+LYRIC_H/2);
ctx.lineTo(W*0.72+8, LYRIC_Y+LYRIC_H/2+4);
ctx.strokeStyle = '#E60012'; ctx.lineWidth = 1.5; ctx.stroke();

ctx.fillStyle = '#E60012';
ctx.fillText('← 全宽歌词栏  56px 高', W*0.785, LYRIC_Y + LYRIC_H/2 + 5);

// Arrow to faded next line
ctx.beginPath();
ctx.moveTo(W*0.78, LYRIC_Y + LYRIC_H + 28);
ctx.lineTo(W*0.72 + 8, LYRIC_Y + LYRIC_H + 28);
ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.5; ctx.stroke();
ctx.beginPath();
ctx.moveTo(W*0.72+8, LYRIC_Y+LYRIC_H+24);
ctx.lineTo(W*0.72, LYRIC_Y+LYRIC_H+28);
ctx.lineTo(W*0.72+8, LYRIC_Y+LYRIC_H+32);
ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.5; ctx.stroke();
ctx.fillStyle = '#aaa'; ctx.font = '12px Arial';
ctx.fillText('← 下一句预览（淡色，可选）', W*0.785, LYRIC_Y + LYRIC_H + 33);

// ── Size comparison: old small pill ──
const OLD_PY = LYRIC_Y + LYRIC_H + 70;
// old pill
ctx.fillStyle = 'rgba(255,255,255,0.93)';
const oldText = '就让这 大风吹 大风吹 一直吹';
ctx.font = 'bold 24px Arial';
const oldTW = ctx.measureText(oldText).width;
rrect(ctx, W/2-oldTW/2-20, OLD_PY, oldTW+40, 42, 8);
ctx.fill();
ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2.5;
rrect(ctx, W/2-oldTW/2-20, OLD_PY, oldTW+40, 42, 8);
ctx.stroke();
ctx.fillStyle = '#1a1a2e'; ctx.textAlign = 'center';
ctx.fillText(oldText, W/2, OLD_PY + 30);

// old label
ctx.fillStyle = '#999'; ctx.font = '12px Arial';
ctx.fillText('← 旧版小药丸（居中浮动，42px）', W/2, OLD_PY + 66);

// VS divider
ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
ctx.beginPath();
ctx.moveTo(W*0.1, OLD_PY - 16);
ctx.lineTo(W*0.9, OLD_PY - 16);
ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle = '#ccc'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
ctx.fillText('对比  ↑新  ↓旧', W/2, OLD_PY - 4);

// ── Dimension callouts ──
// Full width arrow
ctx.strokeStyle = '#0AB9E6'; ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(20, LYRIC_Y + 8); ctx.lineTo(W-20, LYRIC_Y + 8); ctx.stroke();
ctx.beginPath();
ctx.moveTo(20+6, LYRIC_Y+4); ctx.lineTo(20, LYRIC_Y+8); ctx.lineTo(20+6, LYRIC_Y+12);
ctx.moveTo(W-26, LYRIC_Y+4); ctx.lineTo(W-20, LYRIC_Y+8); ctx.lineTo(W-26, LYRIC_Y+12);
ctx.stroke();
ctx.fillStyle = '#0AB9E6'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
ctx.fillRect(W/2-40, LYRIC_Y+2, 80, 14);
ctx.fillStyle = '#fff'; ctx.fillText('全屏宽度', W/2, LYRIC_Y+12);

</script>
</body>
</html>
